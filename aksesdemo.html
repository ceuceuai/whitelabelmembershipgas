<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Akses Demo Admin Whitelabel Membership">
  <title>Akses Demo Admin — Whitelabel Membership</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --navy:#0f172a;
      --ink:#172033;
      --muted:#667085;
      --blue:#2f7df6;
      --violet:#6b50f6;
      --green:#20c77a;
      --line:#e5eaf2;
      --white:#fff;
      --shadow:0 24px 70px rgba(15,23,42,.13);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:28px 18px;
      font-family:"Plus Jakarta Sans",system-ui,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 10%,rgba(47,125,246,.15),transparent 28%),
        radial-gradient(circle at 90% 10%,rgba(107,80,246,.16),transparent 30%),
        linear-gradient(180deg,#f7fbff 0%,#ffffff 100%);
    }

    .card{
      width:min(100%,560px);
      padding:34px;
      border:1px solid var(--line);
      border-radius:28px;
      background:rgba(255,255,255,.94);
      box-shadow:var(--shadow);
      text-align:center;
    }

    .logo{
      width:72px;
      height:72px;
      object-fit:contain;
      margin:0 auto 16px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:8px 12px;
      border-radius:999px;
      background:#ecfdf5;
      border:1px solid #a7f3d0;
      color:#047857;
      font-size:11px;
      font-weight:800;
      letter-spacing:.05em;
      text-transform:uppercase;
    }

    h1{
      margin:16px 0 10px;
      font-family:"Montserrat",sans-serif;
      font-size:clamp(30px,7vw,42px);
      line-height:1.08;
      letter-spacing:-.035em;
      color:var(--navy);
    }

    p{
      margin:0;
      color:var(--muted);
      font-size:14px;
    }

    .login-box{
      margin:26px 0 20px;
      padding:18px;
      border:1px solid var(--line);
      border-radius:18px;
      background:#f8fafc;
      text-align:left;
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:18px;
      padding:10px 0;
      border-bottom:1px dashed #d9e0ea;
    }

    .row:last-child{border-bottom:0}

    .label{
      color:#64748b;
      font-size:13px;
      font-weight:700;
    }

    .value{
      color:var(--navy);
      font-size:14px;
      font-weight:800;
      font-family:"Montserrat",sans-serif;
      text-align:right;
      word-break:break-all;
    }

    .btn{
      width:100%;
      min-height:56px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      border-radius:14px;
      color:#fff;
      background:linear-gradient(135deg,var(--blue),var(--violet));
      box-shadow:0 14px 32px rgba(67,80,236,.28);
      font-weight:800;
      text-decoration:none;
      transition:.2s ease;
    }

    .btn:hover{transform:translateY(-2px)}

    .note{
      margin-top:14px;
      color:#98a2b3;
      font-size:11px;
      line-height:1.55;
    }

    @media(max-width:520px){
      .card{padding:26px 20px;border-radius:22px}
      .row{align-items:flex-start}
      .label{font-size:12px}
      .value{font-size:13px}
    }
  </style>
</head>
<body>

  <main class="card">
    <img class="logo"
      src="https://imersnesia.com/wp-content/uploads/2026/08/icon-whitelabel-membership.png"
      alt="Whitelabel Membership">

    <div class="badge">✓ Demo Admin</div>

    <h1>Akses Demo Admin</h1>
    <p>Silakan masuk ke dashboard demo dan cek langsung fitur serta alur sistemnya.</p>

    <div class="login-box">
      <div class="row">
        <span class="label">Username</span>
        <span class="value">admin</span>
      </div>
      <div class="row">
        <span class="label">Password</span>
        <span class="value">whitelabel123</span>
      </div>
    </div>

    <!-- GANTI # DENGAN URL LOGIN ADMIN DEMO -->
    <a class="btn" href="#">Login ke Demo Admin →</a>

    <div class="note">
      Gunakan akun demo di atas. Jangan mengubah data penting apabila akses demo digunakan bersama pengguna lain.
    </div>
  </main>

</body>
</html>
