<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Whitelabel Produk Digital</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        bglight: '#f8f9fc',
                        brandblue: '#3b82f6',
                    }
                }
            }
        }
    </script>
    
    <style>
        .toast-msg {
            position: fixed; top: 20px; right: 20px; z-index: 10000;
            padding: 15px 25px; border-radius: 8px; font-weight: 600;
            color: white; transform: translateX(150%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
        }
        .toast-msg.show { transform: translateX(0); }
        .toast-success { background-color: #10b981; }
        .toast-error { background-color: #ef4444; }

        #loadingOverlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(4px);
            z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 0.3s ease;
        }
    </style>
</head>
<body class="bg-bglight text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- Global Loading -->
    <div id="loadingOverlay" style="display: none; opacity: 0;">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500 mb-3"></i>
        <p class="text-sm font-medium text-gray-600">Memproses pesanan Anda...</p>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast-msg">Pesan disini</div>

    <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden border border-gray-100">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-8 text-center text-white relative">
            <div class="w-16 h-16 bg-white/20 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-4 backdrop-blur-sm shadow-inner">
                <i class="fa-solid fa-cart-shopping"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">Selesaikan Pesanan</h1>
            <p class="text-blue-100 text-sm">Akses instan ke produk digital Anda setelah pembayaran.</p>
            
            <!-- Affiliate Badge (Hidden by default) -->
            <div id="affBadge" style="display: none;" class="absolute top-4 right-4 bg-white/20 px-3 py-1 rounded-full text-xs font-semibold backdrop-blur-sm border border-white/30">
                <i class="fa-solid fa-handshake mr-1"></i> Referred
            </div>
        </div>

        <div class="p-8">
            <form id="checkoutForm" onsubmit="processCheckout(event)">
                
                <!-- Product Selection -->
                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-3">Pilih Produk</label>
                    <div class="space-y-3">
                        <!-- Product 1 -->
                        <label class="flex items-center justify-between p-4 border border-gray-200 rounded-xl cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition-all">
                            <div class="flex items-center">
                                <input type="radio" name="product" value="Bundle Template Promosi|150000" class="w-5 h-5 text-blue-600 focus:ring-blue-500 border-gray-300" required>
                                <span class="ml-3 font-semibold text-gray-800">Bundle Template Promosi</span>
                            </div>
                            <span class="font-bold text-blue-600">Rp 150.000</span>
                        </label>
                        
                        <!-- Product 2 -->
                        <label class="flex items-center justify-between p-4 border border-gray-200 rounded-xl cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition-all">
                            <div class="flex items-center">
                                <input type="radio" name="product" value="Masterclass Affiliate|350000" class="w-5 h-5 text-blue-600 focus:ring-blue-500 border-gray-300">
                                <span class="ml-3 font-semibold text-gray-800">Masterclass Affiliate</span>
                            </div>
                            <span class="font-bold text-blue-600">Rp 350.000</span>
                        </label>
                    </div>
                </div>

                <!-- Customer Details -->
                <div class="mb-8">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Alamat Email Pengiriman</label>
                    <input type="email" id="customerEmail" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all" placeholder="email.anda@gmail.com">
                    <p class="text-xs text-gray-500 mt-2"><i class="fa-solid fa-shield-halved mr-1"></i> Produk akan dikirimkan ke email ini.</p>
                </div>

                <!-- Hidden Input for Affiliate Code -->
                <input type="hidden" id="affiliateCode" value="">

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-colors shadow-lg shadow-blue-500/30 text-lg flex justify-center items-center">
                    <i class="fa-solid fa-lock mr-2"></i> Bayar Sekarang
                </button>
            </form>
            
            <div id="successScreen" style="display: none;" class="text-center py-6">
                <div class="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Pembayaran Berhasil!</h2>
                <p class="text-gray-600 mb-6">Terima kasih. Sistem kami sedang menyiapkan produk Anda. Cek kotak masuk email Anda dalam 5 menit ke depan.</p>
                <button onclick="window.location.reload()" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-2 px-6 rounded-lg transition-colors">
                    Kembali
                </button>
            </div>
        </div>
    </div>

    <script>
        // MASUKIN URL WEB APP GAS LU DI SINI!! SAMA KAYAK YANG DI INDEX.HTML
        const API_URL = "https://script.google.com/macros/s/AKfycbxWtHODmLsT71J1pOqybXoKpucs2sjxWnEi01pe0V95b4Mj8tRyZTW8Y5Pw16uAsEIe/exec";

        // Toast Notification Helper
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `toast-msg toast-${type} show`;
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        // Tangkap parameter 'aff' dari URL (Misal: checkout.html?aff=WM-ADMIN99)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const affCode = urlParams.get('aff');
            
            if (affCode) {
                document.getElementById('affiliateCode').value = affCode;
                document.getElementById('affBadge').style.display = 'block'; // Tampilkan badge kalau dia pakai link aff
                console.log("Tracked Affiliate:", affCode);
            }
        });

        // Proses Submit Form Checkout
        async function processCheckout(e) {
            e.preventDefault();
            
            // Tampilkan loading
            const overlay = document.getElementById('loadingOverlay');
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.style.opacity = '1'; }, 10);

            // Ambil data dari form
            const email = document.getElementById('customerEmail').value;
            const productRaw = document.querySelector('input[name="product"]:checked').value;
            const affCode = document.getElementById('affiliateCode').value;
            
            // Pecah value produk (Format: "Nama Produk|Harga")
            const productSplit = productRaw.split('|');
            const productName = productSplit[0];
            const productPrice = parseInt(productSplit[1]);

            const payload = {
                email: email,
                produk: productName,
                total_bayar: productPrice,
                affCode: affCode
            };

            try {
                // Tembak API Google Apps Script dengan metode anti-CORS
                // Kita gunakan fetch POST dengan body JSON stringified yang dibaca sebagai text/plain oleh GAS
                const response = await fetch(API_URL, {
                    method: 'POST',
                    redirect: 'follow', // Penting untuk GAS karena dia suka nge-redirect saat merespon POST
                    body: JSON.stringify({ action: 'checkout', payload: payload })
                });
                
                // Cek jika response tidak ok (gagal fetch)
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                
                // Sembunyikan loading
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; }, 300);

                if (result.status === 'success') {
                    // Sembunyikan form, tampilkan pesan sukses
                    document.getElementById('checkoutForm').style.display = 'none';
                    document.getElementById('successScreen').style.display = 'block';
                    showToast("Pembayaran dikonfirmasi!", "success");
                } else {
                    showToast(result.message || "Gagal memproses pesanan", "error");
                }
                
            } catch (error) {
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; }, 300);
                showToast("Terjadi kesalahan jaringan atau CORS", "error");
                console.error("Fetch Error:", error);
                
                // Trik fallback darurat jika CORS Vercel benar-benar nge-block fetch POST
                // Fallback ini menggunakan mode 'no-cors'. Kelemahannya kita ga bisa baca response JSON-nya (opaque),
                // tapi datanya TETAP MASUK ke Google Sheets.
                console.log("Mencoba fallback mode no-cors...");
                fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: 'checkout', payload: payload })
                }).then(() => {
                     document.getElementById('checkoutForm').style.display = 'none';
                     document.getElementById('successScreen').style.display = 'block';
                     showToast("Permintaan terkirim (Fallback mode)", "success");
                }).catch(e => console.error("Fallback gagal juga", e));
            }
        }
    </script>
</body>
</html>
